    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How is a monthly loan payment calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A fully amortizing payment is P × r × (1+r)^n / ((1+r)^n − 1), where P is the amount borrowed, r is the monthly interest rate (annual rate ÷ 12) and n is the number of months. Each payment covers the interest accrued that month, and whatever is left reduces the principal."
            }
          },
          {
            "@type": "Question",
            "name": "What is the difference between the interest rate and the APR?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The interest rate prices the borrowing alone. The APR also includes origination fees, points and closing costs, expressed as a yearly rate. Because two loans at the same rate can carry very different fees, the APR is the fair way to compare offers."
            }
          },
          {
            "@type": "Question",
            "name": "Does paying extra on a loan actually save money?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Extra payments reduce the principal immediately, so every future month accrues interest on a smaller balance. The saving is largest early in the term, when the balance — and therefore the interest charge — is at its highest."
            }
          },
          {
            "@type": "Question",
            "name": "Is snowball or avalanche better for paying off multiple debts?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Avalanche — attacking the highest interest rate first — always costs the least interest mathematically. Snowball clears the smallest balance first, which delivers a faster visible win and helps some people stay consistent. The cheapest plan is the one you keep to."
            }
          }
        ]
      }
    </script>
