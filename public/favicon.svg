<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LoanWise calculator">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)" />
  <!-- Calculator display -->
  <rect x="15" y="13" width="34" height="12" rx="3.5" fill="#fff" opacity="0.95" />
  <rect x="19" y="17.5" width="17" height="3" rx="1.5" fill="#4f46e5" />
  <!-- Keypad: three rows, the last key stretched like an equals bar -->
  <g fill="#fff" opacity="0.9">
    <rect x="15" y="30" width="9" height="8" rx="2.5" />
    <rect x="27.5" y="30" width="9" height="8" rx="2.5" />
    <rect x="40" y="30" width="9" height="8" rx="2.5" />
    <rect x="15" y="42" width="9" height="8" rx="2.5" />
    <rect x="27.5" y="42" width="21.5" height="8" rx="2.5" />
  </g>
</svg>
