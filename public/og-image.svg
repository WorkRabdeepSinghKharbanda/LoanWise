  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="80" r="220" fill="#818cf8" opacity="0.18" />
  <circle cx="90" cy="560" r="180" fill="#a78bfa" opacity="0.15" />

