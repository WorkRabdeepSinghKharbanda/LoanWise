  <rect x="90" y="86" width="76" height="76" rx="18" fill="url(#mark)" />
  <text x="128" y="136" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">LW</text>

  <text x="182" y="140" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#0f172a">LoanWise</text>

  <text x="90" y="270" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#0f172a">Know the real cost</text>
