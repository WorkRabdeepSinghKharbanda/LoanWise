name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Math + render smoke tests. A page that crashes on mount fails here.
      - run: npm test

      # tsc -b && vite build — type errors block the merge.
      - run: npm run build
